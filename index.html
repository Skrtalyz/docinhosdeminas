    <title>Método Docinhos de Minas</title>
    <!-- Safe JSON.stringify wrapper to protect against circular structures from external tracking tracking tools -->
    <script>
      (function() {
        const originalStringify = JSON.stringify;
        JSON.stringify = function(value, replacer, space) {
          const seen = new WeakSet();
          function safeReplacer(key, val) {
            if (val && typeof val === 'object' && val.nodeType) {
              return {
                tagName: val.tagName,
                id: val.id,
                className: val.className
              };
            }
            if (key && (key.startsWith('__reactFiber') || key.startsWith('__reactProps') || key.startsWith('__reactEvents') || key.startsWith('__reactHandled') || key.startsWith('_react'))) {
              return undefined;
            }
            if (val && typeof val === 'object') {
              if (seen.has(val)) {
                return '[Circular]';
              }
              seen.add(val);
            }
            if (typeof replacer === 'function') {
              return replacer(key, val);
            }
            return val;
          }
          try {
            if (Array.isArray(replacer)) {
              return originalStringify(value, (key, val) => {
                if (key === '' || replacer.indexOf(key) !== -1) {
                  return val && typeof val === 'object' && seen.has(val) ? '[Circular]' : val;
                }
                return undefined;
              }, space);
            }
            return originalStringify(value, safeReplacer, space);
          } catch (e) {
            try {
              const simpleSeen = new WeakSet();
              return originalStringify(value, function(k, v) {
                if (v && typeof v === 'object') {
                  if (v.nodeType) return '[Element]';
                  if (simpleSeen.has(v)) return '[Circular]';
                  simpleSeen.add(v);
                }
                if (k && (k.startsWith('__reactFiber') || k.startsWith('__reactProps') || k.startsWith('_react'))) return undefined;
                return v;
              }, space);
            } catch (err) {
              return '"[Unserializable Object]"';
            }
          }
        };
      })();
    </script>
